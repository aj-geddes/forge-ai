version: "3.8"

services:
  forge:
    build:
      # Build context is the parent of this repo (not ".") because the
      # Dockerfile also COPYs the sibling ../agentweave editable dependency,
      # which Docker can only reach if it's inside the context. Run this
      # compose file with `docker compose --project-directory . -f
      # docker-compose.yaml build`, or invoke from the parent directory, e.g.:
      #   cd .. && docker compose -f forge-ai/docker-compose.yaml build
      # See Dockerfile.dockerignore (colocated with the Dockerfile, so it is
      # honored no matter which directory ends up as the build context -
      # local compose/skaffold or CI) and Dockerfile for the full explanation.
      context: ..
      dockerfile: forge-ai/Dockerfile
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      - FORGE_CONFIG_PATH=/app/config/forge.yaml
      - LOG_LEVEL=DEBUG
    volumes:
      - ./forge.yaml.example:/app/config/forge.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/live').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
