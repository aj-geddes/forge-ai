[project]
name = "forge-agent"
version = "0.1.0"
description = "Tool builder and PydanticAI agent core for Forge AI"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "forge-config",
    "forge-security",
    # PeerCaller (agent/peers.py) uses agentweave's PeerVerificationError
    # directly for outbound mTLS peer-identity verification (ADR-0004
    # SS6). Declared explicitly rather than left as an implicit
    # transitive import via forge-security.
    "agentweave",
    "pydantic-ai>=0.1",
    "litellm>=1.50",
    "fastmcp>=2.0",
    "httpx>=0.28",
    "simpleeval>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_agent"]
