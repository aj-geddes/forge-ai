# Production-scale overrides.
# Note: the old "large" profile's separate gateway pod, the litellm
# "dedicated" mode deployment, and the default Redis deployment have all
# been removed from this chart -- none of them were wired to anything the
# application code actually uses. Scale by adding replicas to the single
# agent deployment (below) instead.
profile: large

agent:
  replicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 2
