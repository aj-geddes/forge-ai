# Cluster-specific overrides for the hvs-k8s cluster, dev-aj-geddes namespace,
# reachable at https://forgeai.hvslocal via the shared Gateway API listener.
#
# Consumed by the ArgoCD Application at deploy/argocd/application.yaml via
# spec.source.helm.valueFiles.

profile: small

image:
  repository: harbor.hvslocal/dev-aj-geddes/forge-ai
  # Immutable tag pinned to the commit the image was built from. Update this
  # (and re-push a new image) on every deploy -- never track :latest.
  tag: "a88f82a"
  pullPolicy: IfNotPresent

agent:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

service:
  type: ClusterIP
  port: 8000

httpRoute:
  enabled: true
  hostnames:
    - forgeai.hvslocal
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: https
  # Don't serve /metrics over the public hostname; Prometheus scrapes the pod IP
  # directly, so this doesn't affect monitoring. See templates/httproute.yaml.
  blockPublicMetrics: true

# Pulls LLM provider API keys from OpenBao (kv/users/aj-geddes/app/forge-ai)
# via the "openbao" SecretStore already provisioned in dev-aj-geddes, into a
# Secret consumed by the agent Deployment's envFrom. The entry must exist in
# OpenBao with these two properties before the pod will have working LLM
# credentials (its absence does not block the pod from becoming Ready --
# forge_gateway's readiness check only tracks tool-surface/agent init, not
# whether the configured API keys are real -- but LLM calls will fail until
# populated).
externalSecret:
  enabled: true
  secretStoreRef:
    name: openbao
    kind: SecretStore
  refreshInterval: 1h
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: users/aj-geddes/app/forge-ai
        property: openai_api_key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: users/aj-geddes/app/forge-ai
        property: anthropic_api_key
    # Encrypts the BFF session cookie. Rotating this invalidates all sessions,
    # which is the intended blast radius.
    - secretKey: FORGE_SESSION_KEY
      remoteRef:
        key: users/aj-geddes/app/forge-ai
        property: session_encryption_key

# Minimal, sensible forge.yaml. No secret values are embedded -- LLM API keys
# are ${ENV_VAR} references resolved at process startup from the env vars
# populated by the externalSecret above (see forge_config.loader's
# _substitute_env_vars). Tool sources are intentionally empty: this chart
# should not depend on reachable third-party OpenAPI endpoints at agent
# startup, since a failed tool-surface build marks the "agent" health
# component "failed" and holds the pod out of the Service via /health/ready.
forgeConfig:
  metadata:
    name: forge-ai
    version: "0.1.0"
    description: "Forge AI gateway - hvs-k8s / dev-aj-geddes"
    environment: development
  llm:
    # Default to the on-LAN vLLM endpoint: no cloud egress, no API key to
    # rotate, no per-token cost. Verified reachable from a pod in this
    # namespace (GET http://192.168.86.42:8000/v1/models -> ["nemotron-puzzle"]).
    # It is OpenAI-compatible, so LiteLLM routes to it with the openai/ prefix
    # plus api_base; vLLM requires no auth, but LiteLLM demands a non-empty
    # api_key, hence the placeholder.
    default_model: nemotron
    temperature: 0.7
    max_tokens: 4096
    system_prompt: "You are a helpful AI assistant with access to tools."
    litellm:
      mode: embedded
      model_list:
        - model_name: nemotron
          litellm_params:
            model: openai/nemotron-puzzle
            api_base: http://192.168.86.42:8000/v1
            api_key: not-used-by-vllm
        # Cloud fallback. Only reachable when the corresponding key is
        # populated in OpenBao at kv/users/aj-geddes/app/forge-ai.
        - model_name: claude-sonnet
          litellm_params:
            model: anthropic/claude-sonnet-4-20250514
            api_key: ${ANTHROPIC_API_KEY}
      fallback_models:
        - claude-sonnet
      timeout: 60.0
      max_retries: 3
  security:
    # Authentication is ENFORCED. Per ADR-0001 this is also the schema default,
    # so removing this block does not silently disable auth.
    auth:
      mode: enforce

    # Dex OIDC. forge-ai is registered as a PUBLIC client (deploy/dex/oauth2client.yaml):
    # the gateway runs the authorization-code flow server-side with PKCE and keeps
    # tokens out of the browser behind an httpOnly session cookie (BFF), so there is
    # no client_secret anywhere.
    oidc:
      enabled: true
      issuer: "https://dex.hvslocal/dex"
      client_id: "forge-ai"
      jwks_uri: "https://dex.hvslocal/dex/keys"
      redirect_uri: "https://forgeai.hvslocal/auth/callback"
      scopes: ["openid", "email", "profile", "groups"]
      allowed_algorithms: ["RS256"]
      session:
        encryption_key:
          source: env
          name: FORGE_SESSION_KEY
        secure: true
        same_site: lax

    # Machine clients cannot do interactive OIDC. Only the SHA-256 digest lives
    # here — a digest is not a secret, so adding a machine principal stays a
    # reviewable diff. The raw break-glass token is in OpenBao
    # (kv/users/aj-geddes/app/forge-ai, key `breakglass_token`) and exists so that
    # a broken Dex or a bad role binding cannot lock us out of our own admin API.
    service_tokens:
      enabled: true
      tokens:
        - id: breakglass
          description: "Emergency admin access, OIDC-independent. Rotate after use."
          secret_sha256: "3bb9578430956ca1030a081b547467b526a679053cc12054ff886171609d804a"
          roles: ["admin"]

    # Deny by default: no matching binding => 403. Bound to the operator's
    # identity as Dex actually asserts it (confirmed via a real login on
    # 2026-07-12): GitHub aj-geddes -> stable opaque sub + verified primary
    # email aj_geddes@yahoo.com. Dex's github connector sends no `groups`, so
    # sub is the robust identifier (unspoofable, survives email changes); the
    # verified email is kept as a readable secondary match.
    authorization:
      default_role: null
      metrics_public: true
      bindings:
        - role: admin
          subs: ["CgkyMTEyMTk0NDISBmdpdGh1Yg"]
          emails: ["aj_geddes@yahoo.com"]

    # Deprecated, inert. Kept explicitly false so nothing silently re-enables them.
    agentweave:
      enabled: false
    api_keys:
      enabled: false

    rate_limit_rpm: 60
    # Never "*": the wildcard plus credentialed CORS is a total compromise once a
    # session cookie exists. The config schema now rejects that combination.
    allowed_origins:
      - "https://forgeai.hvslocal"
  agents:
    default: assistant
    agents:
      - name: assistant
        description: "General-purpose assistant"
        system_prompt: "You are a helpful assistant."
        max_turns: 10

# Mount the namespace hvslocal-ca-bundle ConfigMap so the OIDC clients trust
# Dex (dex.hvslocal is served under the hvslocal Root CA, not a public CA).
caBundle:
  enabled: true
  configMapName: hvslocal-ca-bundle
  key: ca.crt
  mountPath: /etc/forge/ca
