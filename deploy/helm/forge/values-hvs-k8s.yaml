# Cluster-specific overrides for the hvs-k8s cluster, dev-aj-geddes namespace,
# reachable at https://forgeai.hvslocal via the shared Gateway API listener.
#
# Consumed by the ArgoCD Application at deploy/argocd/application.yaml via
# spec.source.helm.valueFiles.

profile: small

image:
  repository: harbor.hvslocal/dev-aj-geddes/forge-ai
  # Immutable tag pinned to the commit the image was built from. Update this
  # (and re-push a new image) on every deploy -- never track :latest.
  tag: "723e784"
  pullPolicy: IfNotPresent

agent:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

service:
  type: ClusterIP
  port: 8000

httpRoute:
  enabled: true
  hostnames:
    - forgeai.hvslocal
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: https
  # Don't serve /metrics over the public hostname; Prometheus scrapes the pod IP
  # directly, so this doesn't affect monitoring. See templates/httproute.yaml.
  blockPublicMetrics: true

# Pulls LLM provider API keys from OpenBao (kv/users/aj-geddes/app/forge-ai)
# via the "openbao" SecretStore already provisioned in dev-aj-geddes, into a
# Secret consumed by the agent Deployment's envFrom. The entry must exist in
# OpenBao with these two properties before the pod will have working LLM
# credentials (its absence does not block the pod from becoming Ready --
# forge_gateway's readiness check only tracks tool-surface/agent init, not
# whether the configured API keys are real -- but LLM calls will fail until
# populated).
externalSecret:
  enabled: true
  secretStoreRef:
    name: openbao
    kind: SecretStore
  refreshInterval: 1h
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: users/aj-geddes/app/forge-ai
        property: openai_api_key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: users/aj-geddes/app/forge-ai
        property: anthropic_api_key
    # Encrypts the BFF session cookie. Rotating this invalidates all sessions,
    # which is the intended blast radius.
    - secretKey: FORGE_SESSION_KEY
      remoteRef:
        key: users/aj-geddes/app/forge-ai
        property: session_encryption_key
    # Postiz Public API key (Settings -> Developers -> Public API), used by the
    # social_* tools to publish through the self-hosted Postiz. Lives only in
    # OpenBao at users/aj-geddes/app/postiz; the social_publish tool references it
    # as ${POSTIZ_API_KEY}.
    - secretKey: POSTIZ_API_KEY
      remoteRef:
        key: users/aj-geddes/app/postiz
        property: postiz_api_key

# Minimal, sensible forge.yaml. No secret values are embedded -- LLM API keys
# are ${ENV_VAR} references resolved at process startup from the env vars
# populated by the externalSecret above (see forge_config.loader's
# _substitute_env_vars). Tool sources are intentionally empty: this chart
# should not depend on reachable third-party OpenAPI endpoints at agent
# startup, since a failed tool-surface build marks the "agent" health
# component "failed" and holds the pod out of the Service via /health/ready.
forgeConfig:
  metadata:
    name: forge-ai
    version: "0.1.0"
    description: "Forge AI gateway - hvs-k8s / dev-aj-geddes"
    environment: development
  llm:
    # Default to the on-LAN vLLM endpoint: no cloud egress, no API key to
    # rotate, no per-token cost. Verified reachable from a pod in this
    # namespace (GET http://192.168.86.42:8000/v1/models -> ["nemotron-puzzle"]).
    # It is OpenAI-compatible, so LiteLLM routes to it with the openai/ prefix
    # plus api_base; vLLM requires no auth, but LiteLLM demands a non-empty
    # api_key, hence the placeholder.
    default_model: nemotron
    temperature: 0.7
    max_tokens: 4096
    system_prompt: "You are a helpful AI assistant with access to tools."
    litellm:
      mode: embedded
      model_list:
        - model_name: nemotron
          litellm_params:
            model: openai/nemotron-puzzle
            api_base: http://192.168.86.42:8000/v1
            api_key: not-used-by-vllm
        # Cloud fallback. Only reachable when the corresponding key is
        # populated in OpenBao at kv/users/aj-geddes/app/forge-ai.
        - model_name: claude-sonnet
          litellm_params:
            model: anthropic/claude-sonnet-4-20250514
            api_key: ${ANTHROPIC_API_KEY}
      fallback_models:
        - claude-sonnet
      timeout: 60.0
      max_retries: 3
  # First real tool surface for the agent. Every endpoint here is keyless and
  # was verified reachable from a pod in this namespace, and every tool exercises
  # a distinct tool-builder feature so this doubles as a live smoke test of the
  # builder (path templating, query forwarding, result_path, field_map dot-paths,
  # raw passthrough, and workflow step chaining). No API keys => nothing to leak
  # and no OpenBao dependency. These are manual_tools with a hard-coded URL, so a
  # transient upstream outage fails the individual call at request time; it does
  # NOT fail the tool-surface build (that only happens for openapi_sources that
  # must be fetched at startup), so the pod stays Ready regardless.
  tools:
    manual_tools:
      # wttr.in returns a one-line text summary for format=4 (not JSON), so the
      # tool returns that string verbatim (no response_mapping). `location` is
      # consumed by the URL template; `format` is not, so for a GET it is
      # forwarded as the ?format= query param.
      - name: get_weather
        description: >-
          Get a short current-weather summary for a location (city name,
          airport code, or "lat,lon"). Returns a one-line text summary.
        parameters:
          - name: location
            type: string
            description: "City name, airport code, or 'lat,lon' coordinates"
            required: true
          - name: format
            type: string
            description: "wttr.in format string; '4' is a compact one-liner"
            required: false
            default: "4"
        api:
          url: "https://wttr.in/{{location}}"
          method: GET
          timeout: 15.0
      # ip-api.com returns a flat JSON object; field_map pulls the useful fields
      # out by dot-path (regionName -> region) and drops the rest.
      - name: geolocate_ip
        description: >-
          Look up the approximate geographic location (city, region, country,
          latitude/longitude) of a public IPv4/IPv6 address.
        parameters:
          - name: ip
            type: string
            description: "Public IP address, e.g. 8.8.8.8"
            required: true
        api:
          url: "http://ip-api.com/json/{{ip}}"
          method: GET
          timeout: 15.0
          response_mapping:
            field_map:
              ip: "query"
              city: "city"
              region: "regionName"
              country: "country"
              lat: "lat"
              lon: "lon"
      # GitHub's public repo endpoint needs no auth for public repos. Accept
      # header pins the v3 media type; field_map trims the large payload to the
      # handful of fields worth returning to the model.
      - name: github_repo
        description: >-
          Fetch public metadata for a GitHub repository: description, primary
          language, star/fork counts, and open-issue count.
        parameters:
          - name: owner
            type: string
            description: "Repository owner or org, e.g. 'astral-sh'"
            required: true
          - name: repo
            type: string
            description: "Repository name, e.g. 'uv'"
            required: true
        api:
          url: "https://api.github.com/repos/{{owner}}/{{repo}}"
          method: GET
          timeout: 15.0
          headers:
            Accept: "application/vnd.github+json"
          response_mapping:
            field_map:
              name: "full_name"
              description: "description"
              language: "language"
              stars: "stargazers_count"
              forks: "forks_count"
              open_issues: "open_issues_count"
      # Coinbase spot price. The payload nests under `data`; field_map dot-paths
      # (data.amount, ...) read straight into the nested object from the root.
      - name: crypto_price
        description: >-
          Get the current spot price of a cryptocurrency in a fiat currency.
          Pass a Coinbase pair like 'BTC-USD' or 'ETH-EUR'.
        parameters:
          - name: pair
            type: string
            description: "Coinbase price pair, e.g. 'BTC-USD'"
            required: true
        api:
          url: "https://api.coinbase.com/v2/prices/{{pair}}/spot"
          method: GET
          timeout: 15.0
          response_mapping:
            field_map:
              price: "data.amount"
              base: "data.base"
              currency: "data.currency"
      # open.er-api.com returns {result, base_code, rates:{USD:1, EUR:..., ...}}.
      # result_path extracts just the rates map; `base` is consumed by the URL
      # template so it is not forwarded as a query param.
      - name: exchange_rates
        description: >-
          Get current fiat exchange rates for a base currency (default USD).
          Returns a map of ISO currency code -> rate relative to the base.
        parameters:
          - name: base
            type: string
            description: "ISO 4217 base currency code, e.g. 'USD'"
            required: false
            default: "USD"
        api:
          url: "https://open.er-api.com/v6/latest/{{base}}"
          method: GET
          timeout: 15.0
          response_mapping:
            result_path: "$.rates"
      # dictionaryapi.dev returns a JSON ARRAY of entries. field_map/result_path
      # only apply to dict responses, so the raw array is returned and the model
      # reads the definitions out of it directly.
      - name: define_word
        description: >-
          Look up the dictionary definition(s), part of speech, and phonetics
          for an English word.
        parameters:
          - name: word
            type: string
            description: "The English word to define"
            required: true
        api:
          url: "https://api.dictionaryapi.dev/api/v2/entries/en/{{word}}"
          method: GET
          timeout: 15.0
      # --- Social publishing (self-hosted Postiz) ---
      # Read-only: list the social channels connected in Postiz (Bluesky today).
      # The agent uses this to discover channel ids/platforms. Not gated.
      - name: social_channels
        description: >-
          List the social media channels connected in Postiz (e.g. Bluesky),
          returning each channel's id, name, platform (identifier), and profile.
          Use this to find the channel id to publish to.
        parameters: []
        api:
          url: "http://postiz:5000/api/public/v1/integrations"
          method: GET
          timeout: 15.0
          auth:
            type: api_key
            header_name: Authorization
            token:
              source: env
              name: POSTIZ_API_KEY
      # GATED (requires_approval): publishing is irreversible + outward-facing, so
      # a call does NOT post — it drafts an approval request that a human must
      # approve (agent:approve) before Postiz actually publishes. This is the
      # draft -> approve -> publish governance from ADR-0005 6.2. `date` uses the
      # {{__now__}} synthetic template so `type: now` publishes at approval time.
      - name: social_publish
        description: >-
          Publish a text post to a connected social channel via Postiz. This
          does NOT post immediately — it creates a draft that a human must
          approve before it goes live. Provide the post text; channel_id and
          platform default to the connected Bluesky account.
        requires_approval: true
        parameters:
          - name: content
            type: string
            description: "The post text to publish"
            required: true
          - name: channel_id
            type: string
            description: "Postiz integration id of the target channel"
            required: false
            default: "cmrkn65we0001gk71twg8b9qq"
          - name: platform
            type: string
            description: "Postiz platform identifier / settings __type"
            required: false
            default: "bluesky"
        api:
          url: "http://postiz:5000/api/public/v1/posts"
          method: POST
          timeout: 20.0
          auth:
            type: api_key
            header_name: Authorization
            token:
              source: env
              name: POSTIZ_API_KEY
          body_template:
            type: now
            date: "{{__now__}}"
            shortLink: false
            tags: []
            posts:
              - integration:
                  id: "{{channel_id}}"
                value:
                  - content: "{{content}}"
                    image: []
                settings:
                  __type: "{{platform}}"
    workflows:
      # Composes two of the manual tools above: geolocate an IP, then fetch the
      # weather for the resulting city. Demonstrates step chaining via output_as
      # + {{loc.city}} template refs and a sandboxed `condition` guard (skips the
      # weather step if geolocation produced no city).
      - name: weather_at_ip
        description: >-
          Given a public IP address, look up its city and return the current
          weather there. Chains geolocate_ip -> get_weather.
        parameters:
          - name: ip
            type: string
            description: "Public IP address to locate and get weather for"
            required: true
        steps:
          - tool: geolocate_ip
            params:
              ip: "{{ip}}"
            output_as: loc
          - tool: get_weather
            params:
              location: "{{loc.city}}"
            output_as: weather
            condition: "loc.city is not None"
  security:
    # Authentication is ENFORCED. Per ADR-0001 this is also the schema default,
    # so removing this block does not silently disable auth.
    auth:
      mode: enforce

    # Dex OIDC. forge-ai is registered as a PUBLIC client (deploy/dex/oauth2client.yaml):
    # the gateway runs the authorization-code flow server-side with PKCE and keeps
    # tokens out of the browser behind an httpOnly session cookie (BFF), so there is
    # no client_secret anywhere.
    oidc:
      enabled: true
      issuer: "https://dex.hvslocal/dex"
      client_id: "forge-ai"
      jwks_uri: "https://dex.hvslocal/dex/keys"
      redirect_uri: "https://forgeai.hvslocal/auth/callback"
      scopes: ["openid", "email", "profile", "groups"]
      allowed_algorithms: ["RS256"]
      session:
        encryption_key:
          source: env
          name: FORGE_SESSION_KEY
        secure: true
        same_site: lax

    # Machine clients cannot do interactive OIDC. Only the SHA-256 digest lives
    # here — a digest is not a secret, so adding a machine principal stays a
    # reviewable diff. The raw break-glass token is in OpenBao
    # (kv/users/aj-geddes/app/forge-ai, key `breakglass_token`) and exists so that
    # a broken Dex or a bad role binding cannot lock us out of our own admin API.
    service_tokens:
      enabled: true
      tokens:
        - id: breakglass
          description: "Emergency admin access, OIDC-independent. Rotate after use."
          secret_sha256: "3bb9578430956ca1030a081b547467b526a679053cc12054ff886171609d804a"
          roles: ["admin"]
      # User-issued API keys (ADR-0002): a logged-in user mints their own key,
      # scoped to a subset of their own roles. Only sha256 digests are stored, on
      # the Longhorn PVC mounted at /app/data (persistence.enabled above).
      user_tokens:
        enabled: true
        store_path: /app/data/user_tokens.json
        default_ttl_seconds: 2592000 # 30d
        max_ttl_seconds: 7776000 # 90d

    # Deny by default: no matching binding => 403. Bound to the operator's
    # identity as Dex actually asserts it (confirmed via a real login on
    # 2026-07-12): GitHub aj-geddes -> stable opaque sub + verified primary
    # email aj_geddes@yahoo.com. Dex's github connector sends no `groups`, so
    # sub is the robust identifier (unspoofable, survives email changes); the
    # verified email is kept as a readable secondary match.
    # Dex's authorized-GitHub-user list is the outer gate (only those users can
    # authenticate at all). Everyone Dex admits gets the `user` role and can use
    # the product (chat + tools; API-key issuance once that ships). aj-geddes is
    # the sole admin, bound explicitly by sub below. NOTE: default_role: user
    # means every authenticated Dex user is a user -- that is only safe because
    # login itself is gated (GitHub OAuth app org restriction + the private
    # network). Do NOT combine this with an unrestricted Dex login.
    authorization:
      default_role: user
      metrics_public: true
      bindings:
        - role: admin
          subs: ["CgkyMTEyMTk0NDISBmdpdGh1Yg"]
          emails: ["aj_geddes@yahoo.com"]

    # Deprecated, inert. Kept explicitly false so nothing silently re-enables them.
    # Workload plane (AI-to-AI: SPIFFE mTLS identity + OPA authz). Tells the app
    # to build the WorkloadPlane and start the :8443 mTLS listener. COUPLED with
    # the top-level `agentweave.enabled` deploy flag (which mounts the CSI SVID
    # socket + opens the :8443 Service) — flip BOTH to true to enable. The Dex
    # human plane is unaffected either way; a SPIRE/OPA outage degrades only
    # agent-to-agent traffic and never gates human readiness (ADR-0004).
    agentweave:
      enabled: true
      trust_domain: hvslocal
      opa_endpoint: http://opa.opa.svc.cluster.local:8181
    api_keys:
      enabled: false

    rate_limit_rpm: 60
    # Never "*": the wildcard plus credentialed CORS is a total compromise once a
    # session cookie exists. The config schema now rejects that combination.
    allowed_origins:
      - "https://forgeai.hvslocal"
  # Several agents, each least-privilege-scoped to a tool subset (persona.tools
  # is a hard filter enforced server-side: an agent literally cannot reach a tool
  # outside its list — verified). This is the "forge several agents, compliant &
  # secure" thesis: authoring a new agent is a config edit, not code, and each
  # one only holds the capabilities it needs. `assistant` (the default) keeps the
  # full surface; the others are specialists. All are passive (reactive) today;
  # the passive/active lifecycle model is ADR-0005.
  agents:
    default: assistant
    agents:
      - name: assistant
        mode: passive
        description: "General-purpose assistant with the full tool surface"
        system_prompt: >-
          You are Forge's general-purpose assistant. You have access to weather,
          geolocation, GitHub, cryptocurrency, exchange-rate, and dictionary
          tools. Use them when they help answer the user's question, and say so
          plainly when a request is outside what your tools can do.
        max_turns: 10
      - name: market-analyst
        mode: passive
        description: "Cryptocurrency & FX markets analyst (crypto + exchange rates only)"
        system_prompt: >-
          You are a markets analyst. Answer questions about cryptocurrency spot
          prices and fiat exchange rates using the crypto_price and
          exchange_rates tools. You are scoped to markets only — if asked about
          anything else (weather, code, definitions), say it is outside your
          remit and suggest the general assistant.
        tools:
          - crypto_price
          - exchange_rates
        max_turns: 8
      - name: repo-scout
        mode: passive
        description: "GitHub repository analyst (github_repo only)"
        system_prompt: >-
          You are a GitHub repository analyst. Use the github_repo tool to report
          a repository's description, primary language, stars, forks, and open
          issues, and to compare repositories. You are scoped to public GitHub
          repository metadata only; decline requests outside that scope.
        tools:
          - github_repo
        max_turns: 8
      - name: field-assistant
        mode: passive
        description: "Location & weather assistant (weather + geolocation only)"
        system_prompt: >-
          You are a field assistant for location and weather. Use get_weather,
          geolocate_ip, and the weather_at_ip workflow to answer questions about
          conditions at a place or IP address. You are scoped to weather and
          geolocation; for anything else, point the user to the general assistant.
        tools:
          - get_weather
          - geolocate_ip
          - weather_at_ip
        max_turns: 8
      # Social Manager: scoped to the Postiz social tools. Passive for now (you
      # ask it to post); social_publish is GATED, so drafting a post parks an
      # approval request and nothing goes live until a human approves. When the
      # active runtime (ADR-0005 Phase 1) ships this persona can be flipped to
      # active to draft/schedule on its own — still behind the same approval gate.
      - name: social-manager
        mode: passive
        description: "Social media manager (Postiz publish, human-approved)"
        system_prompt: >-
          You are a social media manager. You can list connected social channels
          with social_channels and publish posts with social_publish. IMPORTANT:
          publishing does not go live immediately — social_publish creates a
          draft that a human must approve before it is posted, so tell the user
          you have drafted the post and it is awaiting their approval. Write
          concise, platform-appropriate posts; do not fabricate engagement data
          (you cannot read comments or metrics). You are scoped to social
          publishing only.
        tools:
          - social_channels
          - social_publish
        max_turns: 8

# Mount the namespace hvslocal-ca-bundle ConfigMap so the OIDC clients trust
# Dex (dex.hvslocal is served under the hvslocal Root CA, not a public CA).
caBundle:
  enabled: true
  configMapName: hvslocal-ca-bundle
  key: ca.crt
  mountPath: /etc/forge/ca

# Longhorn PVC for user-issued API keys; enables the mint/list/revoke feature.
persistence:
  enabled: true
  storageClass: longhorn
  size: 1Gi
  mountPath: /app/data

# Workload plane. SPIRE + OPA are deployed (deploy/cluster/); ship enabled=false
# first, verify the pod pulls an SVID over the CSI socket, then flip to true.
agentweave:
  enabled: true
  socketMountPath: /spiffe-workload-api
  opaEndpoint: http://opa.opa.svc.cluster.local:8181
