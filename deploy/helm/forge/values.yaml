# Default values for forge (small profile)
profile: small

image:
  repository: ghcr.io/aj-geddes/forge-ai
  tag: ""  # Defaults to Chart.appVersion. Always pin explicitly for real deployments.
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- Agent deployment ---
# Forge AI is a single FastAPI process (forge_gateway.app:create_app) that
# serves the REST/MCP/A2A API and the React SPA on one port (8000). There is
# no separate "gateway" workload -- an earlier version of this chart split
# agent/gateway pods for the "large" profile, but the gateway pod ran the
# identical image and received no distinct traffic, so that split was
# removed rather than carried forward.
agent:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  env: []
  envFrom: []

# --- Autoscaling ---
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

# --- Pod Disruption Budget ---
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# --- Service ---
# Metrics are served on the same port as the API (GET /metrics on 8000) --
# there is no separate metrics listener in the app, so there is no separate
# service port for it either.
service:
  type: ClusterIP
  port: 8000

# --- HTTPRoute (Gateway API) ---
# This platform has no Ingress controller; routing is via Gateway API only.
# parentRefs must point at the shared cluster Gateway.
httpRoute:
  blockPublicMetrics: false  # base default; hvs-k8s overrides to true
  enabled: false
  hostnames: []
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: https

# --- External Secrets (OpenBao via External Secrets Operator) ---
# When enabled, renders an ExternalSecret that syncs into a Secret named
# "<fullname>-secrets", which the agent Deployment consumes via envFrom.
# This is the preferred way to supply LLM provider API keys; see
# .Values.secrets below for a manual/local alternative (mutually exclusive
# in practice -- both target the same generated Secret name).
externalSecret:
  enabled: false
  secretStoreRef:
    name: openbao
    kind: SecretStore
  refreshInterval: 1h
  data: []
  # - secretKey: OPENAI_API_KEY
  #   remoteRef:
  #     key: users/aj-geddes/app/forge-ai
  #     property: openai_api_key

# --- Config ---
forgeConfig: {}
#  Override with full forge.yaml content (see forge.yaml.example at repo root
#  for the full schema). Rendered verbatim into the forge.yaml ConfigMap.

# --- Secrets ---
# Manual/local alternative to externalSecret above -- creates a plain Secret
# from literal values (do NOT use this for real deployments; use
# externalSecret against the platform secret store instead).
secrets: {}
#  OPENAI_API_KEY: ""
#  ANTHROPIC_API_KEY: ""

# hvslocal private CA trust for the OIDC clients (off by default).
caBundle:
  enabled: false
  configMapName: hvslocal-ca-bundle
  key: ca.crt
  mountPath: /etc/forge/ca

# Durable storage for user-issued API-key digests (ADR-0002). Off by default.
persistence:
  enabled: false
  storageClass: longhorn
  size: 1Gi
  mountPath: /app/data
