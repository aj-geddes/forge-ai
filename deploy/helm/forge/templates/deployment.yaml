{{- /*
The user-token store (ADR-0002) is a single JSON file on an RWO PersistentVolume.
Two replicas would each hold an independent in-memory index and do last-writer-wins
full-document overwrites, silently corrupting the store. Fail the render loudly
rather than let a future replica/HPA bump quietly break it.
*/ -}}
{{- if .Values.persistence.enabled }}
{{- if or (gt (int .Values.agent.replicaCount) 1) .Values.autoscaling.enabled }}
{{- fail "persistence.enabled is set (RWO user-token store), which requires a single writer: set agent.replicaCount to 1 and autoscaling.enabled to false, or move the token store off the file backend before scaling out." }}
{{- end }}
{{- end }}
{{- /*
ADR-0005 SS6.2/SS11 (security review finding #5): the human-approval gate's
ApprovalStore (forge_agent.active.gate) is in-memory per replica -- "exactly
once" approval only holds within a single process. Running more than one
replica with a gated tool configured risks the same drafted action being
independently approved on two different pods (a duplicate outward-facing
side effect, e.g. a duplicate social-media publish). Fail the render loudly
rather than let a future replica/HPA bump quietly reintroduce that risk. A
Redis-backed ApprovalStore (mirroring RedisConversationStore, ADR-0003) is
the real cross-replica fix and is tracked as a follow-up, not implemented.
*/ -}}
{{- $forgeGatedTool := false }}
{{- if .Values.forgeConfig }}
{{- if .Values.forgeConfig.tools }}
{{- range .Values.forgeConfig.tools.manual_tools }}
{{- if .requires_approval }}{{ $forgeGatedTool = true }}{{- end }}
{{- end }}
{{- range .Values.forgeConfig.tools.openapi_sources }}
{{- if .requires_approval }}{{ $forgeGatedTool = true }}{{- end }}
{{- if .approval_operations }}{{ $forgeGatedTool = true }}{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if $forgeGatedTool }}
{{- if or (gt (int .Values.agent.replicaCount) 1) .Values.autoscaling.enabled }}
{{- fail "forgeConfig declares a human-approval-gated tool (ManualTool.requires_approval, OpenAPISource.requires_approval, or OpenAPISource.approval_operations), which requires a single writer: the in-memory ApprovalStore does not synchronize across replicas (ADR-0005 SS6.2/SS11). Set agent.replicaCount to 1 and autoscaling.enabled to false, or remove the gated tool, until a durable cross-replica ApprovalStore exists." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forge.fullname" . }}-agent
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.agent.replicaCount }}
  {{- end }}
  {{- if .Values.persistence.enabled }}
  # RWO volume can attach to only one node/pod; Recreate stops the old pod (and
  # detaches) before the new one starts, avoiding a multi-attach deadlock.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "forge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        {{- with .Values.agent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "forge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
        {{- with .Values.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: forge-agent
          image: {{ include "forge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            {{- if .Values.agentweave.enabled }}
            # Workload plane (AI-to-AI): pod-terminated mTLS listener. Reached via
            # the -a2a-mtls east-west Service, NOT the HTTPRoute (see ADR-0004).
            - name: a2a-mtls
              containerPort: 8443
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- if .Values.caBundle.enabled }}
            - name: ca-bundle
              mountPath: {{ .Values.caBundle.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.agentweave.enabled }}
            # SPIFFE Workload API socket, provided by the spiffe-csi-driver. The
            # agent fetches its X.509 SVID here to identify on the workload plane.
            - name: spiffe-workload-api
              mountPath: {{ .Values.agentweave.socketMountPath }}
              readOnly: true
            {{- end }}
          env:
            - name: FORGE_CONFIG_PATH
              value: /app/config/forge.yaml
            {{- if .Values.persistence.enabled }}
            # Layered BASE+OVERLAY config (see docs/technical/config-layering.md):
            # FORGE_CONFIG_SEED_PATH is the same file as FORGE_CONFIG_PATH above
            # (the git/ArgoCD source of truth, ConfigMap, readOnly).
            # FORGE_CONFIG_OVERLAY_PATH lives on the SAME RWO PVC as the
            # user-token store -- no new volume, no new credential -- and is
            # only set when persistence is enabled, since without a durable
            # volume there is nowhere safe to persist a runtime edit.
            - name: FORGE_CONFIG_SEED_PATH
              value: /app/config/forge.yaml
            - name: FORGE_CONFIG_OVERLAY_PATH
              value: {{ .Values.persistence.mountPath }}/overlay/forge.overlay.yaml
            {{- end }}
            {{- if .Values.agentweave.enabled }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix://{{ .Values.agentweave.socketMountPath }}/spire-agent.sock
            - name: OPA_ENDPOINT
              value: {{ .Values.agentweave.opaEndpoint | quote }}
            {{- end }}
            {{- if .Values.caBundle.enabled }}
            # Trust the hvslocal private CA so the OIDC clients can verify Dex's
            # cert (Dex is served under the hvslocal CA, not a public one).
            - name: FORGE_OIDC_CA_BUNDLE
              value: {{ .Values.caBundle.mountPath }}/{{ .Values.caBundle.key }}
            {{- end }}
            {{- with .Values.agent.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.secrets .Values.externalSecret.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "forge.fullname" . }}-secrets
          {{- end }}
          {{- with .Values.agent.envFrom }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "forge.fullname" . }}-config
        {{- if .Values.caBundle.enabled }}
        - name: ca-bundle
          configMap:
            name: {{ .Values.caBundle.configMapName }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "forge.fullname" . }}-data
        {{- end }}
        {{- if .Values.agentweave.enabled }}
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
