# Development overrides
# Note: FORGE_ENV / LOG_LEVEL env vars were removed -- no code in this repo
# reads them (config/environment comes from FORGE_CONFIG_PATH's forge.yaml,
# and logging is unconditionally structured). Do not reintroduce env vars
# here without also wiring code to read them.
profile: small

image:
  pullPolicy: Never

agent:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
