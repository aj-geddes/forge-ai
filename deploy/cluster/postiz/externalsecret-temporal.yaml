# Temporal's dedicated Postgres password. Kept in its own OpenBao property
# (separate from Postiz's own postgres_password above) so rotating Temporal's
# DB credential never forces rotating Postiz's app DB credential, and vice
# versa -- same blast-radius-isolation principle as this namespace's existing
# codemind-postgresql / codemind-redis / codemind-neo4j split.
#
# Required OpenBao entry, created BEFORE first sync (see DEPLOY PLAN):
#   path: users/aj-geddes/app/postiz
#   property: temporal_postgres_password   - password for postiz-temporal-postgres
#
# (Same OpenBao path (users/aj-geddes/app/postiz) as externalsecret-postiz.yaml,
# just a different property -- matches forge-ai's own single-path/multi-property
# convention.) The generated Secret exposes the value under two keys so each
# consumer container gets the literal env var name it expects natively, with
# no shell composition needed: POSTGRES_PWD (temporalio/auto-setup) and
# POSTGRES_PASSWORD (the postiz-temporal-postgres postgres:16-alpine container).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz-temporal-secrets
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: temporal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: postiz-temporal-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PWD
      remoteRef:
        key: users/aj-geddes/app/postiz
        property: temporal_postgres_password
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: users/aj-geddes/app/postiz
        property: temporal_postgres_password
