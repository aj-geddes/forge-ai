# Attaches Postiz to the shared Gateway API listener, same pattern as
# deploy/helm/forge/templates/httproute.yaml. TLS is terminated by the
# gateway's hvslocal-wildcard-tls cert -- Postiz must NOT mount its own cert.
#
# PREREQUISITE (manual, outside this ArgoCD app -- see deploy/gateway/):
# postiz.hvslocal must be added as an explicit dnsNames entry on the
# hvslocal-wildcard Certificate in the `gateway` namespace before this route
# is useful; that namespace is outside the dev-aj-geddes AppProject's
# destinations, so it can't be synced by this Application.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: postiz
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: app
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - postiz.hvslocal
  rules:
    - backendRefs:
        - name: postiz
          port: 5000
