# Pulls Postiz's own secrets from OpenBao (kv/users/aj-geddes/app/postiz) via the
# "openbao" SecretStore already provisioned in dev-aj-geddes (see
# deploy/helm/forge/values-hvs-k8s.yaml for the same pattern).
#
# Required OpenBao entry, created BEFORE first sync (see DEPLOY PLAN):
#   path: users/aj-geddes/app/postiz
#   properties:
#     jwt_secret          - long random string; signs session JWTs. Rotating
#                            invalidates every logged-in session.
#     postgres_password   - password for the postiz-postgres app database.
#     redis_password       - password for the postiz-redis instance
#                            (requirepass); Postiz's queues/rate-limiter/cache.
#
# postiz.yaml composes DATABASE_URL/REDIS_URL from these at pod start using
# Kubernetes' native $(VAR) dependent-env-var expansion, so the password is
# stored in OpenBao exactly once, not duplicated as a second "full connection
# string" secret that could drift out of sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz-secrets
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: postiz-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: users/aj-geddes/app/postiz
        property: jwt_secret
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: users/aj-geddes/app/postiz
        property: postgres_password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: users/aj-geddes/app/postiz
        property: redis_password
