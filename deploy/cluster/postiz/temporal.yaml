# Temporal server (auto-setup image: runs schema setup + default-namespace
# creation on first boot, then serves the frontend gRPC on :7233). Required by
# Postiz since v2.12.0 for scheduled posts and background workflows --
# see https://docs.postiz.com/installation/system-requirements.
#
# Not exposed via HTTPRoute: :7233 is Temporal's internal gRPC frontend, only
# ever called by the Postiz app container (TEMPORAL_ADDRESS) and the internal
# postiz-temporal-ui Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz-temporal
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: temporal
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: postiz
      app.kubernetes.io/component: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postiz
        app.kubernetes.io/component: temporal
    spec:
      # Best-effort ordering only: auto-setup's own entrypoint polls the DB
      # with `nc -z` before running schema setup, so a slightly-not-ready
      # postiz-temporal-postgres pod does not crash-loop this container.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postiz-temporal-postgres -U temporal; do echo waiting for postiz-temporal-postgres; sleep 2; done
        # Same best-effort ordering for Elasticsearch: auto-setup's own
        # wait_for_es() will poll ES itself before running setup_es_index(),
        # but starting the main container before ES even answers HTTP just
        # burns through part of the startupProbe's 5-minute first-boot
        # budget on retries. curlimages/curl is a purpose-built minimal image
        # for exactly this kind of readiness gate.
        - name: wait-for-elasticsearch
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - until curl --silent --fail http://postiz-elasticsearch:9200 >/dev/null; do echo waiting for postiz-elasticsearch; sleep 2; done
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.28.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 7233
              protocol: TCP
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: postiz-temporal-postgres
            - name: POSTGRES_USER
              value: temporal
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: config/dynamicconfig/development-sql.yaml
            - name: TEMPORAL_NAMESPACE
              value: default
            # Bind the frontend/history/matching gRPC listeners to all
            # interfaces. Without this, temporal binds only the pod IP, so the
            # localhost:7233 health probes never connect and the startup probe
            # kills a healthy server after its 5-min budget (restart loop).
            - name: BIND_ON_IP
              value: "0.0.0.0"
            # ADVANCED (Elasticsearch) visibility -- required by Postiz
            # >=v2.12.0, which registers more than 3 Text-type custom search
            # attributes on the default namespace at startup; Temporal's SQL
            # (standard) visibility store hard-caps that at 3, so the
            # auto-setup container was crash-looping with "Unable to create
            # search attributes: cannot have more than 3 search attribute of
            # type Text". This ONLY changes the visibility store -- the main
            # persistence store (workflow history, tasks) stays on
            # postiz-temporal-postgres/POSTGRES_SEEDS above; auto-setup skips
            # provisioning the SQL visibility schema/DB entirely whenever
            # ENABLE_ES=true (see temporal-postgres.yaml comment).
            - name: ENABLE_ES
              value: "true"
            - name: ES_SEEDS
              value: postiz-elasticsearch
            - name: ES_PORT
              value: "9200"
            - name: ES_SCHEME
              value: http
            # temporalio/auto-setup:1.28.1 no longer branches on ES_VERSION
            # (its auto-setup.sh unconditionally uses the ES7 "_template"
            # legacy schema files as of the upstream `Remove ES_VERSION from
            # auto-setup.sh` change) -- set anyway for self-documentation and
            # forward/backward compat with auto-setup versions that do still
            # read it. Must stay "v7" while postiz-elasticsearch is pinned to
            # an ES 7.x image (see elasticsearch.yaml).
            - name: ES_VERSION
              value: v7
            # Matches auto-setup.sh's own default; set explicitly so the
            # index name is documented here rather than only implied.
            - name: ES_VIS_INDEX
              value: temporal_visibility_v1_dev
          envFrom:
            - secretRef:
                name: postiz-temporal-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # temporalio/auto-setup ships a `temporal` CLI; the official
          # docker-compose healthcheck runs the same command.
          livenessProbe:
            exec:
              command: ["temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
            periodSeconds: 5
            failureThreshold: 60 # up to 5 minutes for first-boot schema setup
          volumeMounts:
            - name: dynamicconfig
              mountPath: /etc/temporal/config/dynamicconfig
              readOnly: true
      volumes:
        - name: dynamicconfig
          configMap:
            name: postiz-temporal-dynamicconfig
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-temporal
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: temporal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
      protocol: TCP
