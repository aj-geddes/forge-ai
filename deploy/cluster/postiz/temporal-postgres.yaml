# Postgres backing Temporal's PERSISTENCE store only (workflow history,
# tasks, the default namespace, etc). Visibility moved to Elasticsearch
# (postiz-elasticsearch, see elasticsearch.yaml + temporal.yaml's ENABLE_ES
# block) because Postiz >=v2.12.0 registers more than 3 Text-type custom
# search attributes at startup, which SQL (standard) visibility hard-caps at
# 3 and Postiz's auto-setup container was crash-looping on.
#
# NOTE: temporalio/auto-setup's auto-setup.sh only provisions the SQL
# `temporal_visibility` database/schema on this instance when ENABLE_ES is
# false. Before this change it WAS false, so an already-deployed cluster may
# still be carrying that database from the pre-ES first boot -- it is now
# dead weight (auto-setup will never touch it again while ENABLE_ES=true).
# Left in place rather than dropped: harmless, small, and dropping a database
# out from under a stateful Deployment isn't worth the risk for the couple of
# MB it costs. Revisit (drop the DB, or drop this Deployment/PVC entirely if
# Temporal's persistence store also migrates off SQL) if this footprint ever
# actually matters.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-temporal-postgres-data
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: temporal-postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz-temporal-postgres
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: temporal-postgres
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postiz
      app.kubernetes.io/component: temporal-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postiz
        app.kubernetes.io/component: temporal-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postiz-temporal-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postiz-temporal-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-temporal-postgres
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: temporal-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: temporal-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
