# Dedicated Redis for Postiz's queues, public-API rate limiting, and
# short-lived caches (docs: Configuration Reference > REDIS_URL). Deliberately
# NOT the existing codemind-redis-master in this namespace: that instance
# belongs to codemind's own Bitnami chart release (own auth, own failure
# domain) -- reusing it would mix two apps' data/availability behind one
# shared credential, which is exactly the blast-radius mixing this cluster's
# per-app-instance convention avoids.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-redis-data
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz-redis
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postiz
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postiz
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2
          imagePullPolicy: IfNotPresent
          # Vanilla redis image doesn't read a REDIS_PASSWORD env var itself
          # (that's a Bitnami-ism); wrap in a shell so the real process
          # environment variable set by envFrom below is what's read, rather
          # than relying on Kubernetes' separate (and more limited) $(VAR)
          # command-substitution feature.
          command: ["sh", "-c"]
          args:
            - exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes
          envFrom:
            - secretRef:
                name: postiz-secrets
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postiz-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-redis
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
